<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSCS 1A Class Zine</title>
    <link rel="stylesheet" href="main.css">
</head>

<body>
    <main>
        <section class="title" id="title" aria-label="Title">
            <img src="elements/Arcade.webp" alt="Arcade" class="title__arcade">
            <div class="title__arcade-tint" aria-hidden="true"></div>

            <div class="title__super" aria-label="SUPER">
                <span class="mario-char mario-char--blue mario-char--s" aria-hidden="true">S</span>
                <span class="mario-char mario-char--yellow mario-char--u" aria-hidden="true">U</span>
                <span class="mario-char mario-char--red mario-char--p" aria-hidden="true">P</span>
                <span class="mario-char mario-char--green mario-char--e" aria-hidden="true">E</span>
                <span class="mario-char mario-char--yellow mario-char--r" aria-hidden="true">R</span>
            </div>

            <div class="title__bscs" aria-label="BSCS 1A">
                <span class="title__word">
                    <span class="mario-char mario-char--blue mario-char--b" aria-hidden="true">B</span>
                    <span class="mario-char mario-char--yellow mario-char--s1" aria-hidden="true">S</span>
                    <span class="mario-char mario-char--red mario-char--c" aria-hidden="true">C</span>
                    <span class="mario-char mario-char--green mario-char--s2" aria-hidden="true">S</span>
                </span>
                <span class="title__space" aria-hidden="true"></span>
                <span class="title__word">
                    <span class="mario-char mario-char--yellow mario-char--1" aria-hidden="true">1</span>
                    <span class="mario-char mario-char--red mario-char--a" aria-hidden="true">A</span>
                </span>
            </div>

            <div class="title__arcade-patterns" aria-hidden="true"></div>
            <div class="title__stars title__stars--far" aria-hidden="true"></div>
            <div class="title__stars title__stars--near" aria-hidden="true"></div>
        </section>
    </main>
</body>

</html>
