<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img" aria-label="Terminal window printing Hello World" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="600" height="340" rx="16" fill="#0b0f14"/>
  <rect width="600" height="40" rx="16" fill="#1a2330"/>
  <rect y="24" width="600" height="16" fill="#1a2330"/>
  <circle cx="28" cy="20" r="7" fill="#ff5f56"/><circle cx="52" cy="20" r="7" fill="#ffbd2e"/><circle cx="76" cy="20" r="7" fill="#27c93f"/>
  <g font-family="Consolas, monospace" font-size="20">
    <text x="30" y="90" fill="#6b7a8c">// my first program</text>
    <text x="30" y="125" fill="#c792ea">#include</text><text x="132" y="125" fill="#c3e88d">&lt;stdio.h&gt;</text>
    <text x="30" y="165" fill="#82aaff">int main</text><text x="130" y="165" fill="#dedede">() {</text>
    <text x="60" y="205" fill="#82aaff">printf</text><text x="134" y="205" fill="#c3e88d">("Hello, World!");</text>
    <text x="60" y="245" fill="#c792ea">return</text><text x="124" y="245" fill="#f78c6c">0</text><text x="138" y="245" fill="#dedede">;</text>
    <text x="30" y="285" fill="#dedede">}</text>
    <text x="30" y="322" fill="#09c547">&gt; Hello, World!_</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
